[build]
  command = "npm --prefix src/frontend install && npm --prefix src/frontend run build"
  publish = "src/frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/api/lm"
  to = "/.netlify/functions/lm"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
