[build]
  base = "src/frontend"
  command = "npm run build"
  publish = "dist"
  functions = "../../netlify/functions"

[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/api/lm"
  to = "/.netlify/functions/lm"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
