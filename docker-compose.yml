services:
  # ============================================
  # Neo4j – Knowledge Graph Database
  # ============================================
  neo4j:
    image: neo4j:5-community
    container_name: aegis-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - ./data/neo4j-init:/var/lib/neo4j/import
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # OpenSearch – Full-text Search Engine
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aegis-opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # Redis – Cache & Pub/Sub
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # AEGIS Backend – .NET 10 API
  # ============================================
  api:
    build:
      context: ./src/backend
      dockerfile: Aegis.API/Dockerfile
    container_name: aegis-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Neo4j=${NEO4J_URI}
      - Neo4j__User=${NEO4J_USER}
      - Neo4j__Password=${NEO4J_PASSWORD}
      - ConnectionStrings__OpenSearch=${OPENSEARCH_URL}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__Model=qwen2.5:7b
    volumes:
      - ./data/neo4j-init:/app/seed-data
    depends_on:
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network

  # ============================================
  # AEGIS Frontend – React + Vite
  # ============================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - aegis-network

  # ============================================
  # AEGIS Event Simulator – Continuous
  # ============================================
  simulator:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: aegis-simulator
    environment:
      - API_BASE=http://api:8080/api
      - INTERVAL=1.0
      - SCENARIO_INTERVAL_MIN=60
      - SCENARIO_INTERVAL_MAX=90
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - aegis-network

  # ============================================
  # Ollama – Local LLM inference engine
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: aegis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - aegis-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  neo4j-data:
  opensearch-data:
  redis-data:
  ollama-data:

networks:
  aegis-network:
    driver: bridge
